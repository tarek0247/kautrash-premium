version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: kautrash-premium-backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
    volumes:
      - ./backend/src:/app/src
    command: npm run dev

  frontend:
    build:
      context: ./frontend
    container_name: kautrash-premium-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://backend:5000/api
    volumes:
      - ./frontend/src:/app/src
    command: npm run dev

networks:
  default:
    name: kautrash-premium-network